# Morning Read source list.
#
# Three kinds of source:
#   public  — standard Substack RSS, readable by anyone
#   private — per-subscriber feed; the URL is a credential and lives in an env var
#   email   — IMAP fallback for publications with no private feed
#
# Never put a private feed URL in this file. It is committed to the repo.

publications:
  - name: "AI Futures Project"
    type: public
    url: "https://blog.aifutures.org/feed"

  - name: "The Algorithmic Bridge"
    type: public
    url: "https://www.thealgorithmicbridge.com/feed"

  - name: "Lenny's Newsletter"
    type: public
    url: "https://www.lennysnewsletter.com/feed"
    # Lenny publishes podcast episodes as short show-note posts; the real content is
    # audio, which the sanitizer strips, so they arrive as near-empty chapters.
    # Matched as case-insensitive substrings, not regexes -- " | " is his
    # guest-interview title convention and would be an alternation as a regex.
    exclude_titles:
      - "🎙"        # "🎙️ How I AI: ..." episode roundups
      - "How I AI"  # the same series, in case the emoji is dropped
      - " | "       # per-episode write-ups, titled "... | Guest Name"
    # Backstop for show-note stubs that dodge the title patterns. His written
    # essays run 2,000+ words; the podcast posts are 324-668.
    min_words: 700

  - name: "Polity and Policy"
    type: public
    url: "https://politypolicy.substack.com/feed"

  - name: "Noahpinion"
    type: public
    url: "https://www.noahpinion.blog/feed"

  - name: "One Useful Thing"
    type: public
    url: "https://www.oneusefulthing.org/feed"

  - name: "Sharp by Swarajya"
    type: public
    url: "https://sharpbyswarajya.substack.com/feed"

  - name: "Maritime Trade History"
    type: public
    url: "https://nickcollins1953.substack.com/feed"

  - name: "Technically"
    type: public
    url: "https://read.technically.dev/feed"

  - name: "Casual Physics Enjoyer"
    type: public
    url: "https://chillphysicsenjoyer.substack.com/feed"

  - name: "Contraptions"
    type: public
    url: "https://contraptions.venkateshrao.com/feed"

  - name: "Seymour Hersh"
    type: public
    url: "https://seymourhersh.substack.com/feed"

  - name: "Uncharted Territories"
    type: public
    url: "https://unchartedterritories.tomaspueyo.com/feed"

  # A paid publication with a per-subscriber feed. Find the URL under
  # Substack → Settings → your subscriptions → "private feed", then store it as a
  # repository secret named FEED_EXAMPLE_PAID.
  # - name: "Example Paid"
  #   type: private
  #   url_env: "FEED_EXAMPLE_PAID"

  # A publication that only arrives by email. Apply a Gmail filter that labels it
  # `kindle`, and match the sender domain here.
  # - name: "Email Only"
  #   type: email
  #   match_from: "@examplepaid.substack.com"

  - name: "Ashwini Vaishnaw"
    type: public
    url: "https://ashwinivaishnaw.substack.com/feed"

  - name: "Principled Perspectives"
    type: public
    url: "https://raydalio.substack.com/feed"

settings:
  # A week, not a day. Most of these publications post weekly or slower, so a
  # 26-hour window only ever caught 4 of 13 of them -- and anything that fell
  # outside it was missed permanently, since the window moves on. Widening is safe
  # because state/seen.json already prevents re-sends: this is an "unread from the
  # past week" queue, not a "published in the last week" one.
  lookback_hours: 168
  max_words_per_issue: 25000
  skip_if_empty: true
  imap_label: "kindle"
