name: Manage a subscription
description: Add, remove, pause or resume a publication in the daily issue.
labels: ["manage-feed"]
body:
  - type: input
    id: target
    attributes:
      label: Substack link
      description: >
        The homepage, a post you liked, a profile, or the feed itself — any of them
        work. When removing, pausing or resuming, put the publication's name here
        instead.
      placeholder: https://www.noahpinion.blog/p/some-post
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - add
        - remove
        - pause
        - resume
      default: 0
    validations:
      required: true
