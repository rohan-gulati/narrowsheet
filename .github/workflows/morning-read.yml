name: Morning Read

on:
  schedule:
    # 00:00 UTC = 05:30 IST. GitHub's scheduler can lag by a few minutes at busy
    # times; the 26h lookback window means a late run never drops a post.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two issues build at once: they would race on state/seen.json.
concurrency:
  group: morning-read
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install --disable-pip-version-check -e .

      - name: Build and send the issue
        env:
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # One line per private feed, matching the url_env in feeds.yaml:
          # FEED_EXAMPLE_PAID: ${{ secrets.FEED_EXAMPLE_PAID }}
        run: python -m mornings run

      # Only reached when the send succeeded, so seen.json is committed exactly
      # when the posts genuinely went out.
      - name: Commit the state file
        run: |
          set -euo pipefail
          if git diff --quiet -- state/seen.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Record posts sent on $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on the latest main."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "Could not push the state file after three attempts." >&2
          exit 1
