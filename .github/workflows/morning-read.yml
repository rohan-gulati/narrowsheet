name: Morning Read

on:
  schedule:
    # Runs every morning, but does not send every morning. The job only ships an
    # issue once settings.min_posts_per_issue have piled up; otherwise it holds and
    # tries again tomorrow. Waking daily is what lets it notice the moment the pile
    # is big enough, rather than pinning the magazine to a fixed publishing day.
    # 00:00 UTC = 05:30 IST.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if the pile is below min_posts_per_issue"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two issues build at once: they would race on state/seen.json.
concurrency:
  group: morning-read
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install --disable-pip-version-check -e .

      - name: Build and send the issue
        env:
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # One line per private feed, matching the url_env in feeds.yaml:
          # FEED_EXAMPLE_PAID: ${{ secrets.FEED_EXAMPLE_PAID }}
          # Read from the environment rather than interpolated into the script: no
          # ${{ }} belongs inside a run: block, typed boolean or not.
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            python -m mornings run --force
          else
            python -m mornings run
          fi

      # Only reached when the send succeeded, so seen.json is committed exactly
      # when the posts genuinely went out. A run that held back changes nothing, so
      # this step finds no diff and exits quietly.
      - name: Commit the state file
        run: |
          set -euo pipefail
          if git diff --quiet -- state/seen.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Record the issue sent on $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on the latest main."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "Could not push the state file after three attempts." >&2
          exit 1
