name: Manage feeds

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: manage-feeds
  cancel-in-progress: false

jobs:
  apply:
    # This repository is public, so without this gate any stranger could open an
    # issue and cause a commit. Only the repository owner may drive this workflow.
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install --disable-pip-version-check -e .

      - name: Apply the change
        id: apply
        # The issue body is attacker-controlled text, so it is passed through the
        # environment and parsed in Python, never interpolated into the shell.
        # The parsing itself lives in mornings/feeds.py so it can be tested.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python -m mornings feeds apply-issue | tee result.md

      - name: Commit
        if: always()
        # Title is free text, so it reaches the shell through the environment
        # rather than being interpolated into the script.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if git diff --quiet -- feeds.yaml; then
            echo "No change to feeds.yaml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.yaml
          git commit -m "feeds: ${ISSUE_TITLE} (#${ISSUE_NUMBER})"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Report back and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          { echo; echo "---"; echo "_Applied by the manage-feeds workflow._"; } >> result.md || true
          gh issue comment "$ISSUE" --body-file result.md
          if [ "$OUTCOME" = "success" ]; then
            gh issue close "$ISSUE"
          fi
