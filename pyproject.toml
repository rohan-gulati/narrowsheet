[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mornings"
version = "0.1.0"
description = "Compile Substack subscriptions into a daily EPUB for Kindle."
requires-python = ">=3.11"
dependencies = [
    "ebooklib>=0.18",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "Pillow>=10.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    # Round-trips comments when rewriting feeds.yaml; PyYAML would delete them.
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

[tool.setuptools]
packages = ["mornings"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
